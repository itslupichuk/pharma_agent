[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rxterm"
version = "1.0.0"
description = "RXTERM — institutional-grade pharma & biotech trading terminal and morning brief"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
  "textual>=0.80",
  "rich>=13.7",
  "yfinance>=0.2.50",
  "pandas>=2.1",
  "numpy>=1.26",
  "feedparser>=6.0",
  "httpx>=0.27",
  "jinja2>=3.1",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "anthropic>=0.70",
  "tzdata>=2024.1",            # Windows has no system timezone database
  "pywebview>=5.0; sys_platform == 'win32'",   # native desktop window (Edge WebView2)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rxterm = "rxterm.cli:main"

[tool.setuptools.packages.find]
include = ["rxterm*"]

[tool.setuptools.package-data]
rxterm = ["brief/templates/*.html", "tui/*.tcss", "gui/static/*", "gui/static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
